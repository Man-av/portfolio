<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Core — Ingestion Vortex</title>
<style>
  :root{
    --bg: #000000;
    --accent: #ff6a35;
    --accent-soft: #ffcf70;
    --panel-border: rgba(255, 106, 53, 0.35);
    --text-dim: rgba(170, 170, 165, 0.55);
    --text-bright: rgba(235, 230, 220, 0.9);
  }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  .frame{
    position:relative;
    width: min(92vw, 780px);
    aspect-ratio: 16 / 10;
    border: 1px solid var(--panel-border);
    background: var(--bg);
    overflow:hidden;
    cursor: crosshair;
  }
  canvas{ display:block; width:100%; height:100%; }

  .vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background: radial-gradient(120% 100% at 50% 55%, transparent 45%, rgba(0,0,0,0.75) 100%);
  }
  .scanlines{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0.5;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  .corner{
    position:absolute; left:14px; top:12px;
    font-size:11px; letter-spacing:0.04em;
    color: var(--text-dim);
    pointer-events:none;
    transition: transform 0.08s ease, opacity 0.08s ease;
  }
  .corner.glitch{
    transform: translateX(2px) skewX(-4deg);
    opacity: 0.6;
    color: var(--accent-soft);
  }

  .label{
    position:absolute;
    right:14px; bottom:12px;
    text-align:right;
    line-height:1.5;
    font-size:11px;
    letter-spacing:0.04em;
    color: var(--text-dim);
    pointer-events:none;
  }
  .label .top{ color: var(--text-bright); }

  .stats{
    position:absolute;
    left:14px; bottom:12px;
    text-align:left;
    line-height:1.5;
    font-size:11px;
    letter-spacing:0.04em;
    color: var(--text-dim);
    pointer-events:none;
  }
  .stats .top{
    color: var(--accent-soft);
    font-size:13px;
    font-weight:600;
  }
</style>
</head>
<body>

<div class="frame" id="frame">
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="corner" id="corner">// DATA_CORE · move cursor to disturb stream</div>
  <div class="stats">
    <div>THROUGHPUT</div>
    <div class="top" id="throughput">0/s</div>
  </div>
  <div class="label">
    <div class="top">CORE_ENGINE_v3.0</div>
    <div>STREAMING<span id="dots"></span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const frame = document.getElementById('frame');
const canvas = document.getElementById('c');

const ACCENT = 0xff6a35;
const ACCENT_SOFT = 0xffcf70;

// ---------------------------------------------------------------
// core scene setup
// ---------------------------------------------------------------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.09);

const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
const camBase = new THREE.Vector3(0, 1.1, 5.4);
camera.position.copy(camBase);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

scene.add(new THREE.AmbientLight(0x2a1608, 1.1));
const coreLight = new THREE.PointLight(0xffb37a, 2.2, 12);
coreLight.position.set(0, 0, 0);
scene.add(coreLight);
const rimLight = new THREE.PointLight(0xff6a35, 0.6, 20);
rimLight.position.set(-3, 2, -2);
scene.add(rimLight);

// ---------------------------------------------------------------
// textures: soft glow dot + soft ring, generated on canvas
// ---------------------------------------------------------------
function makeGlowTexture(){
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
function makeRingTexture(){
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.lineWidth = 5;
  g.strokeStyle = 'rgba(255,255,255,1)';
  g.shadowColor = 'rgba(255,255,255,1)';
  g.shadowBlur = 14;
  g.beginPath();
  g.arc(size/2, size/2, size/2 - 12, 0, Math.PI * 2);
  g.stroke();
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();
const ringTex = makeRingTexture();

// ---------------------------------------------------------------
// the core: wireframe shell + inner glow + halo
// ---------------------------------------------------------------
const coreGroup = new THREE.Group();
scene.add(coreGroup);

const shellGeo = new THREE.IcosahedronGeometry(0.62, 1);
const shellOutline = new THREE.LineSegments(
  new THREE.EdgesGeometry(shellGeo),
  new THREE.LineBasicMaterial({ color: ACCENT, transparent: true, opacity: 0.75 })
);
coreGroup.add(shellOutline);

const innerCore = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.34, 2),
  new THREE.MeshStandardMaterial({
    color: ACCENT,
    emissive: ACCENT,
    emissiveIntensity: 1.4,
    roughness: 0.35,
    metalness: 0.2,
    transparent: true,
    opacity: 0.55
  })
);
coreGroup.add(innerCore);

const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: ACCENT, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.8
}));
halo.scale.set(2.6, 2.6, 1);
coreGroup.add(halo);

// reusable pulse sprite (expanding ring) fired from the core on a cycle
const pulseSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: ringTex, color: ACCENT_SOFT, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0
}));
scene.add(pulseSprite);
let pulseActive = false;
let pulseT = 0;
let pulseTimer = 0;
const PULSE_INTERVAL = 2.6;

// ---------------------------------------------------------------
// orbiting pipeline rings, each with a satellite node riding it
// ---------------------------------------------------------------
const ringConfigs = [
  { radius: 1.05, tilt: 0.35, speed: 0.42 },
  { radius: 1.45, tilt: -0.5, speed: -0.3 },
  { radius: 1.9,  tilt: 0.65, speed: 0.22 }
];
const orbitPivots = [];

ringConfigs.forEach(cfg => {
  const ringGroup = new THREE.Group();
  ringGroup.rotation.x = cfg.tilt;
  coreGroup.add(ringGroup);

  const torus = new THREE.Mesh(
    new THREE.TorusGeometry(cfg.radius, 0.006, 8, 96),
    new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, opacity: 0.22 })
  );
  ringGroup.add(torus);

  const pivot = new THREE.Object3D();
  ringGroup.add(pivot);

  const satellite = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.06, 0),
    new THREE.MeshStandardMaterial({
      color: ACCENT_SOFT, emissive: ACCENT_SOFT, emissiveIntensity: 1.2,
      roughness: 0.4, metalness: 0.1
    })
  );
  satellite.position.set(cfg.radius, 0, 0);
  pivot.add(satellite);

  const satGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: ACCENT_SOFT, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.7
  }));
  satGlow.scale.set(0.3, 0.3, 1);
  satellite.add(satGlow);

  orbitPivots.push({ pivot, speed: cfg.speed });
});

// ---------------------------------------------------------------
// ingestion vortex: particles spiraling inward from the edges
// ---------------------------------------------------------------
const PARTICLE_COUNT = 1100;
const radius = new Float32Array(PARTICLE_COUNT);
const angle = new Float32Array(PARTICLE_COUNT);
const angularSpeed = new Float32Array(PARTICLE_COUNT);
const height = new Float32Array(PARTICLE_COUNT);
const inwardSpeed = new Float32Array(PARTICLE_COUNT);
const positions = new Float32Array(PARTICLE_COUNT * 3);
const colors = new Float32Array(PARTICLE_COUNT * 3);

const colorWarm = new THREE.Color(ACCENT_SOFT);
const colorHot = new THREE.Color(ACCENT);

function resetParticle(i){
  radius[i] = 2.6 + Math.random() * 2.0;
  angle[i] = Math.random() * Math.PI * 2;
  angularSpeed[i] = 0.18 + Math.random() * 0.3;
  height[i] = (Math.random() - 0.5) * 1.7;
  inwardSpeed[i] = 0.16 + Math.random() * 0.26;

  const mix = Math.random();
  const c = colorWarm.clone().lerp(colorHot, mix);
  colors[i * 3] = c.r;
  colors[i * 3 + 1] = c.g;
  colors[i * 3 + 2] = c.b;
}
for(let i = 0; i < PARTICLE_COUNT; i++) resetParticle(i);

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const particleMat = new THREE.PointsMaterial({
  size: 0.05,
  map: glowTex,
  transparent: true,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});
const particleSystem = new THREE.Points(particleGeo, particleMat);
scene.add(particleSystem);

// ---------------------------------------------------------------
// floor grid — a data-center-floor plane fading into the fog
// ---------------------------------------------------------------
function makeGridTexture(){
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.clearRect(0, 0, size, size);
  g.strokeStyle = 'rgba(255,106,53,0.35)';
  g.lineWidth = 1;
  const step = size / 16;
  for(let i = 0; i <= 16; i++){
    g.beginPath(); g.moveTo(i * step, 0); g.lineTo(i * step, size); g.stroke();
    g.beginPath(); g.moveTo(0, i * step); g.lineTo(size, i * step); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 6);
  return tex;
}
const gridTex = makeGridTexture();
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshBasicMaterial({ map: gridTex, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.9;
scene.add(floor);

// ---------------------------------------------------------------
// sparse starfield for depth
// ---------------------------------------------------------------
const STAR_COUNT = 220;
const starPositions = new Float32Array(STAR_COUNT * 3);
for(let i = 0; i < STAR_COUNT; i++){
  const r = 6 + Math.random() * 4;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);
  starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = Math.abs(r * Math.cos(phi)) * 0.5;
  starPositions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({
  size: 0.035, map: glowTex, color: 0xffb37a, transparent: true, opacity: 0.45,
  sizeAttenuation: true, depthWrite: false
});
scene.add(new THREE.Points(starGeo, starMat));

// ---------------------------------------------------------------
// mouse interaction: parallax camera + cursor "disturbs" the stream
// ---------------------------------------------------------------
const mouseNDC = new THREE.Vector2(0, 0);
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const mouseWorld = new THREE.Vector3();
let hasMouse = false;

frame.addEventListener('pointermove', (e) => {
  const rect = frame.getBoundingClientRect();
  mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
  hasMouse = true;
});
frame.addEventListener('pointerleave', () => { hasMouse = false; });

// ---------------------------------------------------------------
// resize
// ---------------------------------------------------------------
function resize(){
  const w = frame.clientWidth;
  const h = frame.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------
// animate
// ---------------------------------------------------------------
const clock = new THREE.Clock();

function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  // core breathing + spin
  coreGroup.rotation.y += 0.06 * dt;
  const breathe = 1 + Math.sin(time * 1.6) * 0.06;
  innerCore.scale.setScalar(breathe);
  halo.material.opacity = 0.65 + Math.sin(time * 1.6) * 0.15;

  // orbit rings
  orbitPivots.forEach(o => { o.pivot.rotation.y += o.speed * dt; });

  // core pulse cycle
  pulseTimer += dt;
  if(!pulseActive && pulseTimer > PULSE_INTERVAL){
    pulseActive = true;
    pulseT = 0;
    pulseTimer = 0;
  }
  if(pulseActive){
    pulseT += dt;
    const p = Math.min(pulseT / 1.1, 1);
    const scale = 0.6 + p * 5.5;
    pulseSprite.scale.set(scale, scale, 1);
    pulseSprite.material.opacity = 0.55 * (1 - p);
    if(p >= 1) pulseActive = false;
  }

  // mouse -> world point on the core's plane, for stream disturbance
  if(hasMouse){
    raycaster.setFromCamera(mouseNDC, camera);
    raycaster.ray.intersectPlane(groundPlane, mouseWorld);
  }

  // update ingestion vortex
  for(let i = 0; i < PARTICLE_COUNT; i++){
    angle[i] += angularSpeed[i] * dt;
    radius[i] -= inwardSpeed[i] * dt;
    height[i] *= (1 - 0.35 * dt);

    let x = Math.cos(angle[i]) * radius[i];
    let z = Math.sin(angle[i]) * radius[i];

    if(hasMouse){
      const dx = x - mouseWorld.x;
      const dz = z - mouseWorld.z;
      const distSq = dx * dx + dz * dz;
      const R = 0.9;
      if(distSq < R * R){
        const dist = Math.sqrt(distSq) || 0.001;
        const push = (R - dist) / R;
        radius[i] = Math.min(radius[i] + push * 1.6 * dt * 12, 5.8);
        x = Math.cos(angle[i]) * radius[i];
        z = Math.sin(angle[i]) * radius[i];
      }
    }

    if(radius[i] < 0.55){
      resetParticle(i);
      x = Math.cos(angle[i]) * radius[i];
      z = Math.sin(angle[i]) * radius[i];
    }

    positions[i * 3] = x;
    positions[i * 3 + 1] = height[i];
    positions[i * 3 + 2] = z;
  }
  particleGeo.attributes.position.needsUpdate = true;

  // camera parallax + gentle dolly breathing
  const targetX = camBase.x + mouseNDC.x * 0.6;
  const targetY = camBase.y - mouseNDC.y * 0.3;
  camera.position.x += (targetX - camera.position.x) * 0.04;
  camera.position.y += (targetY - camera.position.y) * 0.04;
  camera.position.z = camBase.z + Math.sin(time * 0.15) * 0.3;
  camera.lookAt(0, 0.15, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ---------------------------------------------------------------
// HUD: streaming dots, throughput counter, occasional label glitch
// ---------------------------------------------------------------
const dotsEl = document.getElementById('dots');
let dotCount = 0;
setInterval(() => {
  dotCount = (dotCount + 1) % 4;
  dotsEl.textContent = '.'.repeat(dotCount);
}, 450);

const throughputEl = document.getElementById('throughput');
let throughput = 0;
setInterval(() => {
  throughput += Math.floor(400 + Math.random() * 1400);
  if(throughput > 9_999_999) throughput = 0;
  throughputEl.textContent = throughput.toLocaleString() + '/s';
}, 180);

const cornerEl = document.getElementById('corner');
function scheduleGlitch(){
  const delay = 4000 + Math.random() * 5000;
  setTimeout(() => {
    cornerEl.classList.add('glitch');
    setTimeout(() => cornerEl.classList.remove('glitch'), 140);
    scheduleGlitch();
  }, delay);
}
scheduleGlitch();
</script>

</body>
</html>
